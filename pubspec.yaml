name: billflow
description: BillFlow - Smart Mobile Billing & Inventory Management Application (NEP TYIT CEP Project)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.1

  # State Management
  provider: ^6.1.2

  # Document & PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.2

  # Device & Utility Plugins
  share_plus: ^10.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
